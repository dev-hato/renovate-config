---
name: update-aqua-checksum
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
permissions:
  contents: read
jobs:
  update-aqua-checksum:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.action != 'closed'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        if: github.event.action != 'closed'
        with:
          aqua_version: v2.66.1
      - if: github.event.action != 'closed'
        run: aqua update-checksum --prune
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        # closed時も修正PRを閉じるためにトークンが必要になる
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          client-id: ${{ secrets.PROJECT_AUTOMATION_APP_CLIENT_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.PROJECT_AUTOMATION_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write
          permission-pull-requests: write
      - uses: dev-hato/actions-diff-pr-management@474e401b8a7df75f1c804a60aa987140c1e0548c # v2.5.0
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          github-token: ${{ steps.generate_token.outputs.token }}
          branch-name-prefix: fix-aqua-checksum
          pr-title-prefix: aqua-checksums.jsonを更新してあげたよ！
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
